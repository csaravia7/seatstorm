quarkus.application.name=platform-lib-test
# tests drive the relay and the cleanup by hand
seatstorm.outbox.relay.enabled=false
seatstorm.outbox.cleanup.every=off
seatstorm.admin-token=test-admin-token
# this library has no service migrations
quarkus.flyway.locations=classpath:db/common
quarkus.datasource.devservices.image-name=postgres:16
quarkus.log.console.json=false
quarkus.http.test-port=0
# Avro classes + Avro runtime in one classloader for @QuarkusTest (Apicurio resolves record classes by name).
# TEST ONLY: in prod (fast-jar) it breaks the runtime. Services must copy this line (with %test.) into application.properties.
%test.quarkus.class-loading.parent-first-artifacts=io.seatstorm:contracts,org.apache.avro:avro
