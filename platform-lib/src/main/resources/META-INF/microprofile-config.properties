# Common SeatStorm settings. config_ordinal=100 so each service can override them.
config_ordinal=100

# Broker / registry. Only %prod and %dev are set: in %test Quarkus Dev Services provides Kafka and Apicurio.
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP:kafka:9092}
%dev.kafka.bootstrap.servers=localhost:9094
%prod.mp.messaging.connector.smallrye-kafka.apicurio.registry.url=${APICURIO_URL:http://apicurio:8080/apis/registry/v3}
%dev.mp.messaging.connector.smallrye-kafka.apicurio.registry.url=http://localhost:8081/apis/registry/v3

# Datasource (prod); dev points to the compose Postgres (set per service), tests use Dev Services
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:seatstorm}
quarkus.datasource.password=${DB_PASSWORD:seatstorm}
%prod.quarkus.datasource.jdbc.url=${DB_URL}

# Single outgoing channel; topic, key and partition travel in OutgoingKafkaRecordMetadata
mp.messaging.outgoing.outbox-out.connector=smallrye-kafka
mp.messaging.outgoing.outbox-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.outbox-out.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.outgoing.outbox-out.apicurio.registry.auto-register=true
mp.messaging.outgoing.outbox-out.apicurio.registry.artifact-resolver-strategy=io.apicurio.registry.serde.avro.strategy.RecordIdStrategy
# Registers nested records inline so Kafka UI (ccompat SchemaRegistry serde) can decode the messages (SPK-01)
mp.messaging.outgoing.outbox-out.apicurio.registry.dereference-schema=true
mp.messaging.outgoing.outbox-out.acks=all
mp.messaging.outgoing.outbox-out.enable.idempotence=true

# demo.control consumer (platform-lib DemoControlConsumer); group = <service>-demo-control
mp.messaging.incoming.demo-control.connector=smallrye-kafka
mp.messaging.incoming.demo-control.topic=demo.control
mp.messaging.incoming.demo-control.group.id=${quarkus.application.name}-demo-control
mp.messaging.incoming.demo-control.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.demo-control.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.demo-control.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.demo-control.auto.offset.reset=earliest
mp.messaging.incoming.demo-control.failure-strategy=dead-letter-queue
mp.messaging.incoming.demo-control.dead-letter-queue.topic=demo.control.dlq

# Outbox relay / cleanup / business knobs shared by services
seatstorm.outbox.relay.enabled=true
seatstorm.outbox.relay.interval=200ms
seatstorm.outbox.relay.batch-size=200
seatstorm.outbox.cleanup.every=60s
seatstorm.outbox.cleanup.sent-retention=1h
seatstorm.inbox.cleanup.retention=24h
seatstorm.hold.seconds=60
seatstorm.hold.payment-extension-seconds=120
seatstorm.admin-token=${ADMIN_TOKEN:change-me-admin}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/common,classpath:db/migration
quarkus.hibernate-orm.database.generation=none
quarkus.log.console.json=true
quarkus.log.console.json.additional-field."service".value=${quarkus.application.name}
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h "%r" %s %b %Dms
quarkus.http.access-log.exclude-pattern=/q/health.*
quarkus.http.record-request-start-time=true
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.otel.enabled=false
%dev.quarkus.kafka.devservices.enabled=false
%dev.quarkus.apicurio-registry.devservices.enabled=false
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.log.console.json=false

