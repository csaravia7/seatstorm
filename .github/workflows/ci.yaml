name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java:
    runs-on: ubuntu-latest   # el runner trae Docker para Dev Services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: ./mvnw -B verify

  web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [spa, bff, bots]
    defaults:
      run:
        working-directory: web/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run build

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/assistant-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: services/assistant-agent/requirements.txt }
      - run: pip install -r requirements.txt
      - run: pytest

  deploy-manifests:
    # Validacion de k8s/ (Kustomize) y charts/ (Helm); spec 11.3.1
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Kustomize overlays (strict, no :latest)
        run: |
          for o in aks local; do
            kubectl kustomize "k8s/overlays/$o" > "/tmp/$o.yaml"
            kubeconform -strict -summary "/tmp/$o.yaml"
            if grep -nE ':latest\b' "/tmp/$o.yaml"; then echo "::error::$o contains :latest"; exit 1; fi
          done
      - name: Helm charts
        run: |
          helm lint charts/platform
          helm lint charts/seatstorm
          helm template platform charts/platform -n seatstorm-platform | kubeconform -strict -summary
          helm template seatstorm charts/seatstorm -n seatstorm --set image.tag=ci | kubeconform -strict -summary
      - name: Scripts
        run: for f in k8s/scripts/*.sh; do bash -n "$f"; done
