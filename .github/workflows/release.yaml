name: release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
# Repository secrets required: DOCKER_ID (Docker Hub username) and DOCKER_PAT (personal access token with write access).
# Images are published to docker.io/<DOCKER_ID>/<svc>:<git sha> and :latest (native Quarkus images + bff, bot-swarm, web, assistant-agent).
permissions:
  contents: read
jobs:
  quarkus-native:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        svc: [event-catalog, order-service, seat-inventory, payment-sim, ticketing, seatmap-query, notification]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: docker/login-action@v3
        with: { username: "${{ secrets.DOCKER_ID }}", password: "${{ secrets.DOCKER_PAT }}" }
      - name: Build native image and push
        env:
          # Optional repo secrets: when both are set, the binary is built with the Dynatrace GraalVM Native Image module.
          DT_ENV_URL: ${{ secrets.DT_ENV_URL }}
          DT_API_TOKEN: ${{ secrets.DT_API_TOKEN }}
        run: |
          DT=""
          if [ -n "$DT_ENV_URL" ] && [ -n "$DT_API_TOKEN" ]; then DT="-Pdynatrace-native"; fi
          ./mvnw -B -pl services/${{ matrix.svc }} -am package -DskipTests -Dnative $DT \
            -Dquarkus.native.container-build=true \
            -Dquarkus.docker.dockerfile-native-path=src/main/docker/Dockerfile.native-micro \
            -Dquarkus.container-image.build=true -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.registry=docker.io -Dquarkus.container-image.group=${{ secrets.DOCKER_ID }} \
            -Dquarkus.container-image.name=${{ matrix.svc }} -Dquarkus.container-image.tag=${{ github.sha }} \
            -Dquarkus.container-image.additional-tags=latest
  # Los runners de repos privados tienen ~7 GB de RAM: si la compilacion nativa falla por memoria,
  # usar runners grandes o max-parallel: 1 y -Dquarkus.native.native-image-xmx=6g (spec 11.4).
  node-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: bff,       context: web/bff,  file: web/bff/Dockerfile }
          - { name: bot-swarm, context: web/bots, file: web/bots/Dockerfile }
          - { name: web,       context: web,      file: web/Dockerfile }
          - { name: assistant-agent, context: ., file: services/assistant-agent/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { username: "${{ secrets.DOCKER_ID }}", password: "${{ secrets.DOCKER_PAT }}" }
      - uses: docker/build-push-action@v6
        with: { context: "${{ matrix.context }}", file: "${{ matrix.file }}", push: true, tags: "docker.io/${{ secrets.DOCKER_ID }}/${{ matrix.name }}:${{ github.sha }},docker.io/${{ secrets.DOCKER_ID }}/${{ matrix.name }}:latest" }
