name: deploy-aks
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (git sha). Never 'latest'."
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-aks
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Reject latest
        run: '[ "${{ inputs.tag }}" != "latest" ] || { echo "::error::latest is not allowed"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Write kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}   # az aks get-credentials --admin, base64
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Deploy (helm upgrade --install platform + seatstorm)
        run: make aks-deploy TAG=${{ inputs.tag }}
