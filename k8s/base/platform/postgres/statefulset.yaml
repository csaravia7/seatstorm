apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: &labels
    app.kubernetes.io/name: postgres
    app.kubernetes.io/version: "16"
    app.kubernetes.io/part-of: seatstorm
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels: *labels
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16
          args: ["-c", "max_connections=300"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: seatstorm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seatstorm-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "seatstorm", "-d", "postgres"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "seatstorm", "-d", "postgres"]
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
