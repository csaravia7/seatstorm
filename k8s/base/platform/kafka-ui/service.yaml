# ClusterIP. Acceso: kubectl port-forward -n seatstorm-platform svc/kafka-ui 8085:8080
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  labels:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/version: v1.2.0
    app.kubernetes.io/part-of: seatstorm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
