# PLANTILLA. No contiene valores reales y NO forma parte de ninguna kustomization.
# Los secretos reales se crean con k8s/scripts/create-secrets.sh (lee .env) y nunca se versionan.
# El mismo Secret debe existir en ambos namespaces.
apiVersion: v1
kind: Secret
metadata:
  name: seatstorm-secrets
  namespace: seatstorm-platform
type: Opaque
stringData:
  DB_PASSWORD: CHANGE_ME
  ADMIN_TOKEN: CHANGE_ME
  SESSION_SECRET: CHANGE_ME_32_BYTES_MINIMUM
  CONSOLE_PIN: CHANGE_ME
  TICKET_SECRET: CHANGE_ME
  ANTHROPIC_API_KEY: ""
  NVIDIA_API_KEY: ""
  LLM_PROVIDER: anthropic   # anthropic | nvidia
