apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-swarm
  labels:
    app.kubernetes.io/name: bot-swarm
    app.kubernetes.io/version: dev
    app.kubernetes.io/part-of: seatstorm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bot-swarm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bot-swarm
        app.kubernetes.io/version: dev
        app.kubernetes.io/part-of: seatstorm
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: bot-swarm
          image: docker.io/DOCKER_ID/bot-swarm
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3100
          env:
            - name: DT_RELEASE_VERSION
              value: "dev"
            - name: DT_RELEASE_PRODUCT
              value: "seatstorm"
            - name: KAFKA_BOOTSTRAP
              value: "kafka.seatstorm-platform.svc.cluster.local:9092"
            - name: APICURIO_URL
              value: "http://apicurio.seatstorm-platform.svc.cluster.local:8080/apis/registry/v3"
            - name: DB_USER
              value: "seatstorm"
            - name: QUERY_URL
              value: "http://seatmap-query:8080"
            - name: PORT
              value: "3100"
            - name: TARGET_URL
              value: "http://bff:3000"
          envFrom:
            - secretRef:
                name: seatstorm-secrets
          resources:
            requests:
              cpu: 200m
              memory: 192Mi
            limits:
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
