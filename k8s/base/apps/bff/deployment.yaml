apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  labels:
    app.kubernetes.io/name: bff
    app.kubernetes.io/version: dev
    app.kubernetes.io/part-of: seatstorm
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bff
        app.kubernetes.io/version: dev
        app.kubernetes.io/part-of: seatstorm
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: bff
          image: docker.io/seatstorm/bff
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DT_RELEASE_VERSION
              value: "dev"
            - name: DT_RELEASE_PRODUCT
              value: "seatstorm"
            - name: KAFKA_BOOTSTRAP
              value: "kafka.seatstorm-platform.svc.cluster.local:9092"
            - name: APICURIO_URL
              value: "http://apicurio.seatstorm-platform.svc.cluster.local:8080/apis/registry/v3"
            - name: DB_USER
              value: "seatstorm"
            - name: QUERY_URL
              value: "http://seatmap-query:8080"
            - name: PORT
              value: "3000"
            - name: ORDER_URL
              value: "http://order-service:8080"
            - name: CATALOG_URL
              value: "http://event-catalog:8080"
            - name: PAYMENT_URL
              value: "http://payment-sim:8080"
            - name: AGENT_URL
              value: "http://assistant-agent:8080"
            - name: BOTS_URL
              value: "http://bot-swarm:3100"
            - name: KAFKA_UI_URL
              value: "http://localhost:8085"
            - name: DYNATRACE_URL
              value: ""
          envFrom:
            - secretRef:
                name: seatstorm-secrets
          resources:
            requests:
              cpu: 200m
              memory: 192Mi
            limits:
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
