apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-agent
  labels:
    app.kubernetes.io/name: assistant-agent
    app.kubernetes.io/version: dev
    app.kubernetes.io/part-of: seatstorm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: assistant-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assistant-agent
        app.kubernetes.io/version: dev
        app.kubernetes.io/part-of: seatstorm
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: assistant-agent
          image: docker.io/DOCKER_ID/assistant-agent
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DT_RELEASE_VERSION
              value: "dev"
            - name: DT_RELEASE_PRODUCT
              value: "seatstorm"
            - name: KAFKA_BOOTSTRAP
              value: "kafka.seatstorm-platform.svc.cluster.local:9092"
            - name: APICURIO_URL
              value: "http://apicurio.seatstorm-platform.svc.cluster.local:8080/apis/registry/v3"
            - name: DB_USER
              value: "seatstorm"
            - name: QUERY_URL
              value: "http://seatmap-query:8080"
            - name: PORT
              value: "8080"
            - name: LLM_FALLBACK_PROVIDER
              value: ""
            - name: LLM_MAX_RPM
              value: "30"
            - name: LLM_FIRST_TOKEN_TIMEOUT_S
              value: "30"
            - name: LLM_TOTAL_TIMEOUT_S
              value: "90"
            - name: ANTHROPIC_MODEL
              value: "claude-sonnet-5-5"
            - name: NVIDIA_BASE_URL
              value: "https://integrate.api.nvidia.com/v1"
            - name: NVIDIA_MODEL
              value: "openai/gpt-oss-20b"
            - name: NVIDIA_TEMPERATURE
              value: "1"
            - name: NVIDIA_TOP_P
              value: "1"
            - name: NVIDIA_MAX_TOKENS
              value: "4096"
          envFrom:
            - secretRef:
                name: seatstorm-secrets
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
