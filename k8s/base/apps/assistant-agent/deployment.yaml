apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-agent
  labels:
    app.kubernetes.io/name: assistant-agent
    app.kubernetes.io/version: dev
    app.kubernetes.io/part-of: seatstorm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: assistant-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assistant-agent
        app.kubernetes.io/version: dev
        app.kubernetes.io/part-of: seatstorm
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: assistant-agent
          image: docker.io/DOCKER_ID/assistant-agent
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DT_RELEASE_VERSION
              value: "dev"
            - name: DT_RELEASE_PRODUCT
              value: "seatstorm"
            - name: KAFKA_BOOTSTRAP
              value: "kafka.seatstorm-platform.svc.cluster.local:9092"
            - name: APICURIO_URL
              value: "http://apicurio.seatstorm-platform.svc.cluster.local:8080/apis/registry/v3"
            - name: DB_USER
              value: "seatstorm"
            - name: QUERY_URL
              value: "http://seatmap-query:8080"
            - name: PORT
              value: "8080"
            - name: LLM_FALLBACK_PROVIDER
              value: ""
            # Guardrails del chat: enforce (bloquea/redacta) | monitor (solo registra) | off
            # Demo "la IA se equivoca": monitor = solo registra/evalua (Arize), no bloquea. Volver a "enforce" para proteger.
            - name: GUARDRAILS_MODE
              value: "monitor"
            # strict = alcance y seguridad en el prompt | open = sin restricciones de tema
            - name: PROMPT_PROFILE
              value: "open"
            # Herramientas de organizador (abrir/cerrar venta, reset, pasarela, bots). Cualquiera que chatee podria
            # dispararlas: dejar en "false" salvo en una demo controlada. Usan ADMIN_TOKEN del Secret.
            - name: ASSISTANT_ADMIN_TOOLS
              value: "false"
            - name: ORDER_URL
              value: "http://order-service:8080"
            - name: CATALOG_URL
              value: "http://event-catalog:8080"
            - name: PAYMENT_URL
              value: "http://payment-sim:8080"
            - name: BOTS_URL
              value: "http://bot-swarm:3100"
            # Arize AX: ARIZE_SPACE_ID, ARIZE_API_KEY, ARIZE_OTLP_ENDPOINT y ARIZE_PROJECT_NAME llegan del Secret
            # (envFrom, se piden en setup-env.sh). Un `env:` aqui los pisaria. ARIZE_ENABLED=false desactiva.
            - name: LLM_MAX_RPM
              value: "30"
            - name: LLM_FIRST_TOKEN_TIMEOUT_S
              value: "30"
            - name: LLM_TOTAL_TIMEOUT_S
              value: "90"
            - name: ANTHROPIC_MODEL
              value: "claude-sonnet-5-5"
            - name: NVIDIA_BASE_URL
              value: "https://integrate.api.nvidia.com/v1"
            - name: NVIDIA_MODEL
              value: "nvidia/nemotron-3.5-lightning-30b-a3b"
            - name: NVIDIA_TEMPERATURE
              value: "1"
            - name: NVIDIA_TOP_P
              value: "1"
            - name: NVIDIA_MAX_TOKENS
              value: "4096"
          envFrom:
            - secretRef:
                name: seatstorm-secrets
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
