          - spec.template.metadata.labels.[app.kubernetes.io/version]
          - spec.template.spec.containers.0.env.[name=DT_RELEASE_VERSION].value
      - select: { kind: Service, name: notification }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
  - source:
      kind: Deployment
      name: assistant-agent
      fieldPath: spec.template.spec.containers.0.image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select: { kind: Deployment, name: assistant-agent }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
          - spec.template.metadata.labels.[app.kubernetes.io/version]
          - spec.template.spec.containers.0.env.[name=DT_RELEASE_VERSION].value
      - select: { kind: Service, name: assistant-agent }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
  - source:
      kind: Deployment
      name: bff
      fieldPath: spec.template.spec.containers.0.image
      options:
        delimiter: ":"
