# Overlay AKS (imagenes NATIVAS publicadas por CI: limites de memoria de 256Mi para Quarkus).
# Para imagenes JVM (make push-images) usar el overlay aks-jvm.
# El tag y el repositorio se fijan con `images[].newTag` / `images[].newName`: deploy.sh los reescribe
# (newName = docker.io/$DOCKER_ID/<svc>, tu usuario de Docker Hub). `DOCKER_ID` aqui es un marcador.
# Las etiquetas app.kubernetes.io/version y DT_RELEASE_VERSION se derivan de ese tag con `replacements`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: docker.io/DOCKER_ID/event-catalog
    newName: docker.io/DOCKER_ID/event-catalog
    newTag: "dev"
  - name: docker.io/DOCKER_ID/order-service
    newName: docker.io/DOCKER_ID/order-service
    newTag: "dev"
  - name: docker.io/DOCKER_ID/seat-inventory
    newName: docker.io/DOCKER_ID/seat-inventory
    newTag: "dev"
  - name: docker.io/DOCKER_ID/payment-sim
    newName: docker.io/DOCKER_ID/payment-sim
    newTag: "dev"
  - name: docker.io/DOCKER_ID/ticketing
    newName: docker.io/DOCKER_ID/ticketing
    newTag: "dev"
  - name: docker.io/DOCKER_ID/seatmap-query
    newName: docker.io/DOCKER_ID/seatmap-query
    newTag: "dev"
  - name: docker.io/DOCKER_ID/notification
    newName: docker.io/DOCKER_ID/notification
    newTag: "dev"
  - name: docker.io/DOCKER_ID/assistant-agent
    newName: docker.io/DOCKER_ID/assistant-agent
    newTag: "dev"
  - name: docker.io/DOCKER_ID/bff
    newName: docker.io/DOCKER_ID/bff
    newTag: "dev"
  - name: docker.io/DOCKER_ID/bot-swarm
    newName: docker.io/DOCKER_ID/bot-swarm
    newTag: "dev"
  - name: docker.io/DOCKER_ID/web
    newName: docker.io/DOCKER_ID/web
    newTag: "dev"
patches:
  # imagePullSecret `dockerhub` (limite de descargas anonimas de Docker Hub, spec 11.1)
  - target:
      kind: Deployment|StatefulSet|Job
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: dockerhub
  # IP publica para el Service web
  - target:
      kind: Service
      name: web
    patch: |-
      - op: add
        path: /spec/type
        value: LoadBalancer
replacements:
  - source:
      kind: Deployment
      name: event-catalog
      fieldPath: spec.template.spec.containers.0.image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select: { kind: Deployment, name: event-catalog }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
          - spec.template.metadata.labels.[app.kubernetes.io/version]
          - spec.template.spec.containers.0.env.[name=DT_RELEASE_VERSION].value
      - select: { kind: Service, name: event-catalog }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
  - source:
      kind: Deployment
      name: order-service
      fieldPath: spec.template.spec.containers.0.image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select: { kind: Deployment, name: order-service }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
          - spec.template.metadata.labels.[app.kubernetes.io/version]
          - spec.template.spec.containers.0.env.[name=DT_RELEASE_VERSION].value
      - select: { kind: Service, name: order-service }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
  - source:
      kind: Deployment
      name: seat-inventory
      fieldPath: spec.template.spec.containers.0.image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select: { kind: Deployment, name: seat-inventory }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
          - spec.template.metadata.labels.[app.kubernetes.io/version]
          - spec.template.spec.containers.0.env.[name=DT_RELEASE_VERSION].value
      - select: { kind: Service, name: seat-inventory }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
  - source:
      kind: Deployment
      name: payment-sim
      fieldPath: spec.template.spec.containers.0.image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select: { kind: Deployment, name: payment-sim }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
          - spec.template.metadata.labels.[app.kubernetes.io/version]
          - spec.template.spec.containers.0.env.[name=DT_RELEASE_VERSION].value
      - select: { kind: Service, name: payment-sim }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
  - source:
