          - spec.template.spec.containers.0.env.[name=DT_RELEASE_VERSION].value
      - select: { kind: Service, name: seatmap-query }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
  - source:
      kind: Deployment
