# Overlay local (minikube / kind). Las imagenes deben existir en el nodo
# (`kind load docker-image ...` / `minikube image load ...`) o estar en tu Docker Hub.
# deploy.sh reescribe newName (docker.io/$DOCKER_ID/<svc>; por defecto `seatstorm` en local) y newTag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: docker.io/DOCKER_ID/event-catalog
    newName: docker.io/DOCKER_ID/event-catalog
    newTag: "dev"
  - name: docker.io/DOCKER_ID/order-service
    newName: docker.io/DOCKER_ID/order-service
    newTag: "dev"
  - name: docker.io/DOCKER_ID/seat-inventory
    newName: docker.io/DOCKER_ID/seat-inventory
    newTag: "dev"
  - name: docker.io/DOCKER_ID/payment-sim
    newName: docker.io/DOCKER_ID/payment-sim
    newTag: "dev"
  - name: docker.io/DOCKER_ID/ticketing
    newName: docker.io/DOCKER_ID/ticketing
    newTag: "dev"
  - name: docker.io/DOCKER_ID/seatmap-query
    newName: docker.io/DOCKER_ID/seatmap-query
    newTag: "dev"
  - name: docker.io/DOCKER_ID/notification
    newName: docker.io/DOCKER_ID/notification
    newTag: "dev"
  - name: docker.io/DOCKER_ID/assistant-agent
    newName: docker.io/DOCKER_ID/assistant-agent
    newTag: "dev"
  - name: docker.io/DOCKER_ID/bff
    newName: docker.io/DOCKER_ID/bff
    newTag: "dev"
  - name: docker.io/DOCKER_ID/bot-swarm
    newName: docker.io/DOCKER_ID/bot-swarm
    newTag: "dev"
  - name: docker.io/DOCKER_ID/web
    newName: docker.io/DOCKER_ID/web
    newTag: "dev"
replicas:
  - name: event-catalog
    count: 1
  - name: order-service
    count: 1
  - name: seat-inventory
    count: 1
  - name: payment-sim
    count: 1
  - name: ticketing
    count: 1
  - name: seatmap-query
    count: 1
  - name: notification
    count: 1
  - name: assistant-agent
    count: 1
  - name: bff
    count: 1
  - name: bot-swarm
    count: 1
  - name: web
    count: 1
patches:
  # Plataforma mas pequena
  - target:
      kind: StatefulSet
      name: kafka
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 100m, memory: 384Mi }
          limits: { memory: 768Mi }
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "-Xms256m -Xmx384m"
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { memory: 512Mi }
  # Service web accesible por NodePort: minikube service web -n seatstorm / http://<node-ip>:30080
  - target:
      kind: Service
      name: web
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
replacements:
  - source:
      kind: Deployment
      name: event-catalog
      fieldPath: spec.template.spec.containers.0.image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select: { kind: Deployment, name: event-catalog }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
          - spec.template.metadata.labels.[app.kubernetes.io/version]
          - spec.template.spec.containers.0.env.[name=DT_RELEASE_VERSION].value
      - select: { kind: Service, name: event-catalog }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
  - source:
      kind: Deployment
      name: order-service
      fieldPath: spec.template.spec.containers.0.image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select: { kind: Deployment, name: order-service }
