quarkus.application.name=seat-inventory
%dev.quarkus.http.port=8102
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/inventory_db
quarkus.container-image.group=seatstorm
quarkus.container-image.name=seat-inventory
quarkus.container-image.tag=${TAG:dev}

# Native (GraalVM CE): UBI9 builder to match the ubi9-quarkus-micro-image runtime image
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-graalvmce-builder-image:jdk-21

# TEST ONLY: Avro classes + Avro runtime in one classloader for @QuarkusTest (Apicurio resolves record classes by name)
%test.quarkus.class-loading.parent-first-artifacts=io.seatstorm:contracts,org.apache.avro:avro

# Expiry job cadence (spec 7.2: every second)
seatstorm.expiry.every=1s
%test.seatstorm.expiry.every=off

# seat.commands consumer (spec 7.0 template). concurrency: SmallRye Kafka clones the channel N times (same group).
mp.messaging.incoming.seat-commands.connector=smallrye-kafka
mp.messaging.incoming.seat-commands.topic=seat.commands
mp.messaging.incoming.seat-commands.group.id=seat-inventory-seat-commands
mp.messaging.incoming.seat-commands.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.seat-commands.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.seat-commands.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.seat-commands.auto.offset.reset=earliest
mp.messaging.incoming.seat-commands.concurrency=${SEAT_CONSUMER_CONCURRENCY:1}
mp.messaging.incoming.seat-commands.failure-strategy=dead-letter-queue
mp.messaging.incoming.seat-commands.dead-letter-queue.topic=seat.commands.dlq
# The DLQ producer reuses the channel config: it needs the Avro serializer and registry strategy too (D-12)
mp.messaging.incoming.seat-commands.dead-letter-queue.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.incoming.seat-commands.apicurio.registry.auto-register=true
mp.messaging.incoming.seat-commands.apicurio.registry.artifact-resolver-strategy=io.apicurio.registry.serde.avro.strategy.RecordIdStrategy
mp.messaging.incoming.seat-commands.apicurio.registry.dereference-schema=true

# Tests: topics with the production partition count (explicit partition = section index needs 12)
%test.quarkus.kafka.devservices.topic-partitions."seat.commands"=12
%test.quarkus.kafka.devservices.topic-partitions."seat.events"=12
