quarkus.application.name=order-service
%dev.quarkus.http.port=8101
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/order_db
quarkus.container-image.group=seatstorm
quarkus.container-image.name=order-service
quarkus.container-image.tag=${TAG:dev}

# Native (GraalVM CE): UBI9 builder to match the ubi9-quarkus-micro-image runtime image
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-graalvmce-builder-image:jdk-21

# TEST ONLY: Avro classes + Avro runtime in one classloader for @QuarkusTest (Apicurio resolves record classes by name)
%test.quarkus.class-loading.parent-first-artifacts=io.seatstorm:contracts,org.apache.avro:avro

# Inbound channels (spec 7.0 template)
mp.messaging.incoming.sale-events.connector=smallrye-kafka
mp.messaging.incoming.sale-events.topic=sale.events
mp.messaging.incoming.sale-events.group.id=order-service-sale-events
mp.messaging.incoming.sale-events.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.sale-events.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.sale-events.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.sale-events.auto.offset.reset=earliest
mp.messaging.incoming.sale-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.sale-events.dead-letter-queue.topic=sale.events.dlq

mp.messaging.incoming.seat-events.connector=smallrye-kafka
mp.messaging.incoming.seat-events.topic=seat.events
mp.messaging.incoming.seat-events.group.id=order-service-seat-events
mp.messaging.incoming.seat-events.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.seat-events.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.seat-events.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.seat-events.auto.offset.reset=earliest
mp.messaging.incoming.seat-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.seat-events.dead-letter-queue.topic=seat.events.dlq

mp.messaging.incoming.payment-events.connector=smallrye-kafka
mp.messaging.incoming.payment-events.topic=payment.events
mp.messaging.incoming.payment-events.group.id=order-service-payment-events
mp.messaging.incoming.payment-events.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.payment-events.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.payment-events.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.payment-events.auto.offset.reset=earliest
mp.messaging.incoming.payment-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.payment-events.dead-letter-queue.topic=payment.events.dlq

# Tests (Dev Services): same postgres major as compose; explicit partitions because we publish with explicit partition
%test.quarkus.datasource.devservices.image-name=postgres:16
%test.quarkus.log.console.json=false
%test.quarkus.http.test-port=0
%test.quarkus.kafka.devservices.topic-partitions."seat.commands"=12
%test.quarkus.kafka.devservices.topic-partitions."seat.events"=12
%test.quarkus.kafka.devservices.topic-partitions."order.events"=6
%test.quarkus.kafka.devservices.topic-partitions."payment.commands"=6
%test.quarkus.kafka.devservices.topic-partitions."payment.events"=6
