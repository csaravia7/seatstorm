quarkus.application.name=payment-sim
%dev.quarkus.http.port=8103
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/payment_db
quarkus.container-image.group=seatstorm
quarkus.container-image.name=payment-sim
quarkus.container-image.tag=${TAG:dev}

# Native (GraalVM CE): UBI9 builder to match the ubi9-quarkus-micro-image runtime image
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-graalvmce-builder-image:jdk-21

# TEST ONLY: Avro classes + Avro runtime in one classloader for @QuarkusTest (Apicurio resolves record classes by name)
%test.quarkus.class-loading.parent-first-artifacts=io.seatstorm:contracts,org.apache.avro:avro

# payment.commands: pausable channel (ADR-17). PaymentPauser pauses/resumes it from payment_config.mode.
mp.messaging.incoming.payment-commands.connector=smallrye-kafka
mp.messaging.incoming.payment-commands.topic=payment.commands
mp.messaging.incoming.payment-commands.group.id=payment-sim-payment-commands
mp.messaging.incoming.payment-commands.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.payment-commands.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.payment-commands.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.payment-commands.auto.offset.reset=earliest
mp.messaging.incoming.payment-commands.failure-strategy=dead-letter-queue
mp.messaging.incoming.payment-commands.dead-letter-queue.topic=payment.commands.dlq
mp.messaging.incoming.payment-commands.pausable=true
mp.messaging.incoming.payment-commands.initially-paused=false

seatstorm.payment.pause-poll-interval=500ms

%test.quarkus.datasource.devservices.image-name=postgres:16
%test.quarkus.log.console.json=false
%test.quarkus.http.test-port=0
%test.quarkus.kafka.devservices.topic-partitions."payment.commands"=6
%test.quarkus.kafka.devservices.topic-partitions."payment.events"=6
