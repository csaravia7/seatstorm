quarkus.application.name=notification
%dev.quarkus.http.port=8107
quarkus.container-image.group=seatstorm
quarkus.container-image.name=notification
quarkus.container-image.tag=${TAG:dev}

# notification is stateless (no DB, no outbox, no platform-lib): common settings are repeated here
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP:kafka:9092}
%dev.kafka.bootstrap.servers=localhost:9094
%prod.mp.messaging.connector.smallrye-kafka.apicurio.registry.url=${APICURIO_URL:http://apicurio:8080/apis/registry/v3}
%dev.mp.messaging.connector.smallrye-kafka.apicurio.registry.url=http://localhost:8081/apis/registry/v3
quarkus.log.console.json=true
quarkus.log.console.json.additional-field."service".value=${quarkus.application.name}
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h "%r" %s %b %Dms
quarkus.http.access-log.exclude-pattern=/q/health.*
quarkus.http.record-request-start-time=true
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.otel.enabled=false
%dev.quarkus.kafka.devservices.enabled=false
%dev.quarkus.apicurio-registry.devservices.enabled=false
%dev.quarkus.log.console.json=false

# Native (GraalVM CE): UBI9 builder to match the ubi9-quarkus-micro-image runtime image
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-graalvmce-builder-image:jdk-21

# TEST ONLY: Avro classes + Avro runtime in one classloader for @QuarkusTest (Apicurio resolves record classes by name)
%test.quarkus.class-loading.parent-first-artifacts=io.seatstorm:contracts,org.apache.avro:avro

# Incoming channels (spec 7.0 template). Group ids: notification-<channel>
mp.messaging.incoming.seat-events.connector=smallrye-kafka
mp.messaging.incoming.seat-events.topic=seat.events
mp.messaging.incoming.seat-events.group.id=notification-seat-events
mp.messaging.incoming.seat-events.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.seat-events.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.seat-events.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.seat-events.auto.offset.reset=earliest
mp.messaging.incoming.seat-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.seat-events.dead-letter-queue.topic=seat.events.dlq

mp.messaging.incoming.order-events.connector=smallrye-kafka
mp.messaging.incoming.order-events.topic=order.events
mp.messaging.incoming.order-events.group.id=notification-order-events
mp.messaging.incoming.order-events.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-events.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.order-events.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.order-events.auto.offset.reset=earliest
mp.messaging.incoming.order-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.order-events.dead-letter-queue.topic=order.events.dlq

mp.messaging.incoming.ticket-events.connector=smallrye-kafka
mp.messaging.incoming.ticket-events.topic=ticket.events
mp.messaging.incoming.ticket-events.group.id=notification-ticket-events
mp.messaging.incoming.ticket-events.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.ticket-events.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.ticket-events.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.ticket-events.auto.offset.reset=earliest
mp.messaging.incoming.ticket-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.ticket-events.dead-letter-queue.topic=ticket.events.dlq

mp.messaging.incoming.sale-events.connector=smallrye-kafka
mp.messaging.incoming.sale-events.topic=sale.events
mp.messaging.incoming.sale-events.group.id=notification-sale-events
mp.messaging.incoming.sale-events.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.sale-events.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.sale-events.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.sale-events.auto.offset.reset=earliest
mp.messaging.incoming.sale-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.sale-events.dead-letter-queue.topic=sale.events.dlq

mp.messaging.incoming.demo-control.connector=smallrye-kafka
mp.messaging.incoming.demo-control.topic=demo.control
mp.messaging.incoming.demo-control.group.id=notification-demo-control
mp.messaging.incoming.demo-control.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.demo-control.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.demo-control.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.demo-control.auto.offset.reset=earliest
mp.messaging.incoming.demo-control.failure-strategy=dead-letter-queue
mp.messaging.incoming.demo-control.dead-letter-queue.topic=demo.control.dlq

# ui.events (JSON, StringSerializer, no Avro)
mp.messaging.outgoing.ui-events.connector=smallrye-kafka
mp.messaging.outgoing.ui-events.topic=ui.events
mp.messaging.outgoing.ui-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.ui-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.ui-events.acks=1

seatstorm.notification.feed.max-per-second=30
seatstorm.hold.seconds=60

# TEST ONLY: generic Avro producer channel used by tests to inject domain events (topic/key travel in metadata)
%test.mp.messaging.outgoing.test-out.connector=smallrye-kafka
%test.mp.messaging.outgoing.test-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
%test.mp.messaging.outgoing.test-out.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
%test.mp.messaging.outgoing.test-out.apicurio.registry.auto-register=true
%test.mp.messaging.outgoing.test-out.apicurio.registry.artifact-resolver-strategy=io.apicurio.registry.serde.avro.strategy.RecordIdStrategy
%test.mp.messaging.outgoing.test-out.apicurio.registry.dereference-schema=true
