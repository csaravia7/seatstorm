quarkus.application.name=event-catalog
%dev.quarkus.http.port=8106
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/catalog_db
quarkus.container-image.group=seatstorm
quarkus.container-image.name=event-catalog
quarkus.container-image.tag=${TAG:dev}

# Native (GraalVM CE): UBI9 builder to match the ubi9-quarkus-micro-image runtime image
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-graalvmce-builder-image:jdk-21

# TEST ONLY: Avro classes + Avro runtime in one classloader for @QuarkusTest (Apicurio resolves record classes by name)
%test.quarkus.class-loading.parent-first-artifacts=io.seatstorm:contracts,org.apache.avro:avro

seatstorm.reset.expected=order-service,seat-inventory,payment-sim,ticketing,seatmap-query

# demo.control: platform-lib handles ResetRequested on channel demo-control; this second channel (own group)
# collects ResetCompleted from the other services.
mp.messaging.incoming.reset-completed.connector=smallrye-kafka
mp.messaging.incoming.reset-completed.topic=demo.control
mp.messaging.incoming.reset-completed.group.id=event-catalog-reset-completed
mp.messaging.incoming.reset-completed.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.reset-completed.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.reset-completed.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.reset-completed.auto.offset.reset=earliest
mp.messaging.incoming.reset-completed.failure-strategy=dead-letter-queue
mp.messaging.incoming.reset-completed.dead-letter-queue.topic=demo.control.dlq
mp.messaging.incoming.reset-completed.dead-letter-queue.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.incoming.reset-completed.apicurio.registry.auto-register=true
mp.messaging.incoming.reset-completed.apicurio.registry.artifact-resolver-strategy=io.apicurio.registry.serde.avro.strategy.RecordIdStrategy
mp.messaging.incoming.reset-completed.apicurio.registry.dereference-schema=true
