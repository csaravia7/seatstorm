quarkus.application.name=seatmap-query
%dev.quarkus.http.port=8105
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/query_db
quarkus.container-image.group=seatstorm
quarkus.container-image.name=seatmap-query
quarkus.container-image.tag=${TAG:dev}

# Native (GraalVM CE): UBI9 builder to match the ubi9-quarkus-micro-image runtime image
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-graalvmce-builder-image:jdk-21

# TEST ONLY: Avro classes + Avro runtime in one classloader for @QuarkusTest (Apicurio resolves record classes by name)
%test.quarkus.class-loading.parent-first-artifacts=io.seatstorm:contracts,org.apache.avro:avro

# Incoming channels (spec 7.0 template). Group ids: seatmap-query-<channel>
mp.messaging.incoming.seat-events.connector=smallrye-kafka
mp.messaging.incoming.seat-events.topic=seat.events
mp.messaging.incoming.seat-events.group.id=seatmap-query-seat-events
mp.messaging.incoming.seat-events.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.seat-events.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.seat-events.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.seat-events.auto.offset.reset=earliest
mp.messaging.incoming.seat-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.seat-events.dead-letter-queue.topic=seat.events.dlq

mp.messaging.incoming.order-events.connector=smallrye-kafka
mp.messaging.incoming.order-events.topic=order.events
mp.messaging.incoming.order-events.group.id=seatmap-query-order-events
mp.messaging.incoming.order-events.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-events.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.order-events.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.order-events.auto.offset.reset=earliest
mp.messaging.incoming.order-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.order-events.dead-letter-queue.topic=order.events.dlq

mp.messaging.incoming.ticket-events.connector=smallrye-kafka
mp.messaging.incoming.ticket-events.topic=ticket.events
mp.messaging.incoming.ticket-events.group.id=seatmap-query-ticket-events
mp.messaging.incoming.ticket-events.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.ticket-events.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.ticket-events.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.ticket-events.auto.offset.reset=earliest
mp.messaging.incoming.ticket-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.ticket-events.dead-letter-queue.topic=ticket.events.dlq

