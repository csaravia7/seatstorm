[project]
name = "assistant-agent"
version = "0.1.0"
description = "SeatStorm chat assistant (FastAPI, anthropic + openai SDKs)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "arize-otel",
    "openinference-instrumentation-openai",
    "openinference-instrumentation-anthropic>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["app", "app.llm"]
