{{- $labels := include "platform.labels" (dict "name" "apicurio" "version" (include "platform.imageTag" .Values.apicurio.image)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio
  labels:
    {{- $labels | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apicurio
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
    spec:
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      {{- include "platform.pullSecrets" . | nindent 6 }}
      initContainers:
        - name: wait-postgres
          image: {{ .Values.postgres.image }}
          command: ["/bin/bash", "-c", "until pg_isready -h postgres -U {{ .Values.postgres.user }} -d postgres; do sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      containers:
        - name: apicurio
          image: {{ .Values.apicurio.image }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - { name: APICURIO_STORAGE_KIND, value: sql }
            - { name: APICURIO_STORAGE_SQL_KIND, value: postgresql }
            - { name: APICURIO_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/apicurio_db" }
            - { name: APICURIO_DATASOURCE_USERNAME, value: {{ .Values.postgres.user | quote }} }
            - name: APICURIO_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: DB_PASSWORD
          resources:
            {{- toYaml .Values.apicurio.resources | nindent 12 }}
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: apicurio
  labels:
    {{- $labels | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: apicurio
  ports:
    - name: http
      port: 8080
      targetPort: http
